[package]
name = "vortex-mod-containers"
version = "1.0.0"
edition = "2021"
description = "Container decrypter WASM plugin for Vortex — DLC, CCF, RSDF, Metalink (decrypt to URL list)"
license = "GPL-3.0"
authors = ["vortex-community"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
extism-pdk = "1.4"
hex = "0.4"
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
extism = "1"
rstest = "0.24"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
